<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shellvage</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Fira+Code:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #080810;
    --surface: #0d0d1a;
    --accent: #7DF9A0;
    --accent2: #4DFFCF;
    --dim: rgba(125,249,160,0.12);
    --white: #f0f0f5;
    --muted: rgba(240,240,245,0.35);
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Syne', sans-serif;
    overflow: hidden;
  }

  /* Subtle grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(125,249,160,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(125,249,160,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    padding: 64px 72px;
  }

  /* Top bar — simulated prompt */
  .prompt-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeSlideIn 0.5s ease forwards;
    animation-delay: 0.1s;
  }

  .dot { width: 9px; height: 9px; border-radius: 50%; }
  .dot-r { background: #FF5F5F; }
  .dot-y { background: #FEBC2E; }
  .dot-g { background: #28C840; }

  .prompt-text {
    font-family: 'Fira Code', monospace;
    font-size: 13px;
    color: var(--muted);
    margin-left: 16px;
    letter-spacing: 0.04em;
  }

  .prompt-text span { color: var(--accent); }

  /* Main wordmark */
  .wordmark-wrap {
    position: relative;
    overflow: hidden;
  }

  .wordmark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(72px, 12vw, 130px);
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--white);
    position: relative;
    opacity: 0;
    animation: fadeSlideIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
    animation-delay: 0.35s;
  }

  /* The accent highlight on "SHELL" */
  .wordmark .hl {
    color: var(--accent);
    position: relative;
  }

  /* Scan sweep effect */
  .wordmark::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(125,249,160,0.08) 40%,
      rgba(77,255,207,0.15) 50%,
      rgba(125,249,160,0.08) 60%,
      transparent 100%
    );
    animation: scanSweep 1.4s ease 0.9s forwards;
    pointer-events: none;
  }

  @keyframes scanSweep {
    0%   { left: -60%; opacity: 1; }
    100% { left: 110%; opacity: 0; }
  }

  /* Tagline */
  .tagline {
    font-family: 'Fira Code', monospace;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 18px;
    opacity: 0;
    animation: fadeSlideIn 0.5s ease forwards;
    animation-delay: 0.8s;
  }

  .tagline .acc { color: var(--accent2); }

  /* Bottom accent line */
  .accent-line {
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
    margin-top: 24px;
    animation: lineExpand 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
    animation-delay: 0.6s;
    border-radius: 1px;
  }

  @keyframes lineExpand {
    to { width: 100%; }
  }

  /* Version / meta row */
  .meta-row {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 20px;
    opacity: 0;
    animation: fadeSlideIn 0.5s ease forwards;
    animation-delay: 1s;
  }

  .badge {
    font-family: 'Fira Code', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--accent);
    background: var(--dim);
    border: 1px solid rgba(125,249,160,0.2);
    padding: 4px 10px;
    border-radius: 3px;
  }

  .meta-text {
    font-family: 'Fira Code', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* Blinking cursor after wordmark */
  .cursor {
    display: inline-block;
    width: 3px;
    height: 0.85em;
    background: var(--accent);
    margin-left: 6px;
    vertical-align: -0.05em;
    animation: blink 1.1s step-end infinite;
    animation-delay: 1.5s;
    opacity: 0;
  }

  @keyframes blink {
    0%, 100% { opacity: 0; }
    50%       { opacity: 1; }
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Ambient glow blob behind wordmark */
  .glow-blob {
    position: absolute;
    width: 500px;
    height: 200px;
    background: radial-gradient(ellipse at center,
      rgba(125,249,160,0.07) 0%,
      transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: -1;
    animation: glowPulse 4s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%,-50%) scale(1); }
    50%       { opacity: 1;   transform: translate(-50%,-50%) scale(1.05); }
  }
</style>
</head>
<body>
<div class="container">
  <div class="prompt-bar">
    <div class="dot dot-r"></div>
    <div class="dot dot-y"></div>
    <div class="dot dot-g"></div>
    <span class="prompt-text">~/<span>projects</span> &gt; shellvage --logo</span>
  </div>

  <div class="wordmark-wrap">
    <div class="glow-blob"></div>
    <h1 class="wordmark">
      <span class="hl">SHELL</span>VAGE<span class="cursor"></span>
    </h1>
  </div>

  <div class="accent-line"></div>

  <p class="tagline">
    <span class="acc">// </span>salvage your shell. own your environment.
  </p>

  <div class="meta-row">
    <span class="badge">v1.0.0</span>
    <span class="meta-text">cli · cross-platform · zero config</span>
  </div>
</div>
</body>
</html>
